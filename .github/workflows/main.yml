name: Gerar APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Conceder permissao ao Gradlew
        run: chmod +x gradlew

      - name: Gerar APK de Debug
        run: ./gradlew assembleDebug

      - name: Salvar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
